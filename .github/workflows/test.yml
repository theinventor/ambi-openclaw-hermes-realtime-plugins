name: Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22', '24.16.0', '26.1.0']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:hermes
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=moderate
  openclaw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --prefix "$RUNNER_TEMP/openclaw" openclaw@2026.9.4 --ignore-scripts --no-audit --no-fund
      - run: OPENCLAW_PACKAGE="$RUNNER_TEMP/openclaw/node_modules/openclaw" npm run test:compat:openclaw
  hermes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check out tested Hermes revision
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 1c671beab29164d8931c5d01c5739502267089d8
          path: .test-artifacts/hermes
      - run: python -m pip install -e './.test-artifacts/hermes[cron]'
      - run: HERMES_SOURCE="$PWD/.test-artifacts/hermes" python scripts/compat-hermes.py
      - run: python -m hermes_cli.main plugins doctor "$PWD" --ci
